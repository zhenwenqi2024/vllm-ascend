pr: 19109
entries:
  - category: feature
    text: >-
      Added an experimental Ascend HiSparse backend for sparse MLA/DSA with
      Model Runner V2, private Host pools and unquantized KV caches.
      Requires the paired vLLM HiSparse backend interface; attention C8,
      context parallelism and disaggregated P/D are outside this feature's scope.
  - category: performance
    text: >-
      Vectorized CPU page-transfer descriptor preparation for supported paired
      HiSparse worker revisions, preserving DMA submission and completion events.
